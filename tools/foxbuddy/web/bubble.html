<!doctype html>
<html><head><meta charset="utf-8"><title>Bubble</title>
<style>
  :root { --bg: #FFFDF8; --ink: #2A211D; --muted: #7A6F68; --line: rgba(42,33,29,.12); --accent: #E8743B; --you: #F3E9E0;
          --needs: #E79A1B; --done: #3BAA6B; --code: rgba(42,33,29,.07); --shadow: 0 6px 22px rgba(0,0,0,.22), 0 1px 3px rgba(0,0,0,.15); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #2B2522; --ink: #F5EDE6; --muted: #B5A89F; --line: rgba(255,241,220,.14); --code: rgba(255,241,220,.08); --you: #3D3430; --shadow: 0 6px 22px rgba(0,0,0,.5); }
  }
  html, body { margin: 0; background: transparent; font: 13.5px/1.42 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; color: var(--ink); -webkit-user-select: text; user-select: text; overflow: hidden; }
  #wrap { padding: 10px 12px 18px; }                    /* room for the shadow and the tail */
  #wrap.below { padding: 18px 12px 10px; }
  #card { position: relative; background: var(--bg); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; border-left: 4px solid transparent; }
  #card.needs { border-left-color: var(--needs); }
  #card.done { border-left-color: var(--done); }
  #card::after { content: ""; position: absolute; bottom: -9px; width: 18px; height: 18px; background: var(--bg); transform: rotate(45deg); border-radius: 0 0 4px 0; box-shadow: 3px 3px 5px rgba(0,0,0,.08); }
  #wrap.right #card::after { right: 34px; } #wrap.left #card::after { left: 34px; }
  #wrap.below #card::after { bottom: auto; top: -9px; border-radius: 4px 0 0 0; box-shadow: -2px -2px 4px rgba(0,0,0,.06); }
  /* beside him: the tail points sideways, at him, near the bottom */
  #wrap.beside { padding: 10px 18px 10px 12px; }
  #wrap.beside.left { padding: 10px 12px 10px 18px; }
  #wrap.beside #card::after { bottom: 40px; transform: rotate(-45deg); border-radius: 0 0 4px 0; }
  #wrap.beside.right #card::after { right: -9px; left: auto; }
  #wrap.beside.left #card::after { left: -9px; right: auto; transform: rotate(135deg); }
  #close { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 2px 4px; line-height: 1; z-index: 2; }
  #close:hover { color: var(--ink); }
  #text { padding-right: 16px; word-wrap: break-word; }
  code { background: var(--code); border-radius: 4px; padding: 0 4px; font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
  pre { background: var(--code); border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: 0 0 8px; }
  pre code { background: none; padding: 0; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button.act { border: 0; border-radius: 8px; padding: 6px 12px; font: 600 12.5px -apple-system, sans-serif; cursor: pointer; background: var(--code); color: var(--ink); }
  button.act.primary { background: var(--accent); color: #fff; }
  button.act:hover { filter: brightness(1.05); }
  button.link { border: 0; background: none; padding: 0; color: var(--muted); font: 600 11.5px -apple-system, sans-serif; cursor: pointer; }
  button.link:hover { color: var(--accent); }

  /* the chat */
  #chat { padding-top: 14px; }
  #thread { max-height: min(300px, calc(var(--room, 560px) - 200px)); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
  #thread:empty { display: none; }
  .msg { max-width: 92%; word-wrap: break-word; }
  .msg.you { align-self: flex-end; background: var(--you); border-radius: 12px 12px 4px 12px; padding: 6px 10px; white-space: pre-wrap; }
  .msg.fox { align-self: flex-start; }
  .msg.fox p { margin: 0 0 6px; } .msg.fox p:last-of-type { margin-bottom: 0; }
  .msg.fox ul, .msg.fox ol { margin: 0 0 6px; padding-left: 20px; }
  .msg.fox .tools { margin-top: 3px; }
  .msg.err { color: var(--muted); }
  #composer { margin-top: 10px; }
  #thread:empty + #composer { margin-top: 0; }
  textarea { width: 100%; box-sizing: border-box; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; color: var(--ink); background: transparent; outline: none; min-height: 44px; max-height: 120px; }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .row .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  .row2 { display: flex; align-items: center; gap: 8px; }
  .row2 .spacer { flex: 1; }
  button.link, button.chip { white-space: nowrap; }
  .dots span { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: var(--accent); animation: bob 1s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 80%, 100% { transform: translateY(0); opacity: .5 } 40% { transform: translateY(-5px); opacity: 1 } }
  button.chip { border: 1px solid var(--line); border-radius: 999px; background: none; padding: 3px 9px; color: var(--muted); font: 600 11.5px -apple-system, sans-serif; cursor: pointer; }
  button.chip.on { border-color: var(--accent); color: var(--accent); }
  button.reveal { border: 0; background: none; padding: 0 0 0 6px; color: var(--accent); font: 600 11.5px -apple-system, sans-serif; cursor: pointer; white-space: nowrap; }
  button.reveal:hover { text-decoration: underline; }
  .confirm { margin-top: 8px; border: 1px solid var(--accent); border-radius: 10px; padding: 8px 10px; }
  .confirm .what { font-weight: 600; margin-bottom: 8px; }
  .confirm .actions { margin-top: 0; }
  .confirm.settled { border-color: var(--line); }
  .confirm.settled .actions { display: none; }
  .confirm .result { color: var(--muted); font-size: 12px; }
  .confirm .warn { color: var(--needs); font-weight: 600; font-size: 12px; margin: -4px 0 8px; }
  .confirm .note { color: var(--muted); font-size: 12px; margin: -4px 0 8px; }
  .confirm .args { font-size: 11.5px; margin: 0 0 8px; color: var(--muted); }
  .confirm .args summary { cursor: pointer; font-weight: 600; }
  .confirm .args div { word-break: break-word; margin-top: 3px; }
  .confirm .args .k { font-weight: 600; color: var(--ink); }
  /* the welcome: a few questions the first time */
  #welcome { padding: 4px 0 0; min-width: 300px; }
  #welcome h3 { margin: 0 0 6px; font-size: 16px; }
  #welcome p { margin: 0 0 8px; }
  #welcome .q { font-weight: 600; margin: 0 0 10px; padding-right: 16px; }
  #welcome input, #welcome textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; color: var(--ink); background: transparent; outline: none; }
  #welcome input:focus, #welcome textarea:focus { border-color: var(--accent); }
  #welcome .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #welcome .choices { display: flex; flex-direction: column; gap: 6px; }
  #welcome .choice { text-align: left; border: 1px solid var(--line); border-radius: 10px; background: none; padding: 8px 10px; font: inherit; color: var(--ink); cursor: pointer; }
  #welcome .choice small { display: block; color: var(--muted); font-size: 12px; }
  #welcome .choice.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #welcome .row { margin-top: 12px; }
  #wDots { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
  #wDots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  #wDots span.on { background: var(--accent); }
  [hidden] { display: none !important; }
</style></head>
<body>
<div id="wrap" class="right">
  <div id="card">
    <button id="close" title="Close">×</button>
    <div id="say"><div id="text"></div><div class="actions" id="sayActions" hidden><button class="act primary" id="jump">Show me</button></div></div>
    <div id="welcome" hidden>
      <div id="wStep"></div>
      <div class="row">
        <button class="link" id="wBack">Back</button>
        <span class="spacer"></span>
        <button class="link" id="wSkip">Skip</button>
        <button class="act primary" id="wNext">Next</button>
      </div>
      <div id="wDots"></div>
    </div>
    <div id="chat" hidden>
      <div id="thread"></div>
      <div id="composer">
        <textarea id="input" placeholder="Ask the fox anything…" rows="2"></textarea>
        <div class="row">
          <button class="act primary" id="send">Send</button>
          <span class="spacer"></span>
          <button class="link" id="newChat" title="Forget this conversation and start a new one">New chat</button>
          <button class="link" id="openClaude" title="Carry this conversation into a new Claude Desktop chat">Open in Claude</button>
        </div>
        <div class="hint row2"><span>Return sends · ⌘-Return: Claude</span><span class="spacer"></span><button class="chip" id="files" title="Let him read inside files in the folders he can search, for this chat only">Files: names only</button></div>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const post = m => { try { window.webkit.messageHandlers.bubble.postMessage(m); } catch (e) { (window.__posted = window.__posted || []).push(m); } };
  let ttlTimer = 0, hovering = false, busy = false, readFiles = false;
  const turns = [];                                   // { you, fox } so far in this conversation, for "Open in Claude"

  // Everything shown comes from outside (a command, Claude's reply): it is always treated as text.
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  function markdown(src) {                         // just enough: paragraphs, lists, **bold**, `code`, ``` blocks
    const out = [], parts = String(src).split(/```[a-zA-Z0-9]*\n?/);
    parts.forEach((part, i) => {
      if (i % 2) { out.push('<pre><code>' + esc(part.replace(/\n$/, '')) + '</code></pre>'); return; }
      for (const block of part.split(/\n\s*\n/)) {
        const lines = block.split('\n').filter(l => l.trim());
        if (!lines.length) continue;
        if (lines.every(l => /^\s*([-*•]|\d+[.)])\s+/.test(l))) {
          const ordered = /^\s*\d/.test(lines[0]);
          out.push((ordered ? '<ol>' : '<ul>') + lines.map(l => '<li>' + inline(l.replace(/^\s*([-*•]|\d+[.)])\s+/, '')) + '</li>').join('') + (ordered ? '</ol>' : '</ul>'));
        } else out.push('<p>' + lines.map(l => inline(l.replace(/^#+\s*/, ''))).join('<br>') + '</p>');
      }
    });
    return out.join('');
  }

  function mode(m) { for (const k of ['say', 'chat', 'welcome']) $(k).hidden = m !== k; document.body.dataset.mode = m; report(); }
  function report() { requestAnimationFrame(() => { const r = $('wrap').getBoundingClientRect(); post({ size: { w: Math.ceil(r.width), h: Math.ceil(r.height) } }); }); }
  new ResizeObserver(report).observe($('wrap'));
  function timeout(sec) {
    clearTimeout(ttlTimer);
    if (sec > 0) ttlTimer = setTimeout(function tick() { if (hovering) { ttlTimer = setTimeout(tick, 1000); return; } post({ action: 'dismiss' }); }, sec * 1000);
  }
  $('card').addEventListener('mouseenter', () => hovering = true);
  $('card').addEventListener('mouseleave', () => hovering = false);
  const scrollDown = () => { const t = $('thread'); t.scrollTop = t.scrollHeight; };

  function addYou(q) { const d = document.createElement('div'); d.className = 'msg you'; d.textContent = q; $('thread').appendChild(d); }
  function addFox(html, cls = '') { const d = document.createElement('div'); d.className = 'msg fox ' + cls; d.innerHTML = html; $('thread').appendChild(d); return d; }
  function pending() {
    const d = addFox('<span class="dots"><span></span><span></span><span></span></span><div class="tools"><button class="link">Taking a while? Open in Claude</button></div>', 'pending');
    d.querySelector('button').onclick = () => openInClaude('');
  }
  const dropPending = () => { const p = $('thread').querySelector('.pending'); if (p) p.remove(); };
  function setBusy(b) { busy = b; $('send').disabled = b; $('send').style.opacity = b ? .5 : 1; }

  // The whole conversation (newest last) and anything typed but not sent, as one message for Claude Desktop.
  function transcript(extra) {
    const latest = (extra || '').trim();
    if (!turns.length) return latest;
    const lines = turns.map(t => `Me: ${t.you}` + (t.fox ? `\n\nYou: ${t.fox}` : ''));
    let text = 'Continuing a conversation I started with my desktop assistant:\n\n' + lines.join('\n\n') + (latest ? `\n\nMe: ${latest}` : '');
    if (text.length > 13800) text = '…' + text.slice(-13800);       // the link carries ~14,000 characters: keep the newest
    return text;
  }
  function openInClaude(extra) { const t = transcript(extra); if (t) post({ open: t }); }

  window.bubble = {
    place(side, spot, room) {                     // spot: above | below | beside him; room: how tall it can be there
      $('wrap').className = (side === 'left' ? 'left' : 'right') + (spot === 'below' ? ' below' : spot === 'beside' ? ' beside' : '');
      if (room) document.documentElement.style.setProperty('--room', Math.max(220, room) + 'px');
      report(); scrollDown(); },
    show(m) {                                       // a line about what Claude is doing: { text, kind, jump }
      $('card').className = m.kind === 'needs' ? 'needs' : m.kind === 'done' ? 'done' : '';
      $('text').innerHTML = inline(m.text || '');
      $('sayActions').hidden = !m.jump;
      mode('say');
      timeout(m.kind === 'needs' ? 0 : m.kind === 'done' ? 14 : 6);
    },
    chat(focus = true) { clearTimeout(ttlTimer); $('card').className = ''; mode('chat'); scrollDown(); if (focus) setTimeout(() => $('input').focus(), 30); },
    thinking(q) { turns.push({ you: q, fox: '' }); addYou(q); pending(); setBusy(true); mode('chat'); scrollDown(); },
    answer(text) { dropPending(); setBusy(false);
      // A calendar or Gmail change arrives as a ```fox-confirm block: one tool and its exact arguments. It becomes a card
      // showing all of them, never text. (The app checks the tool again, and the gate holds him to these arguments.)
      // A note for him to remember or forget arrives as a last line "[[confirm remember: ...]]": the app saves it itself.
      let ask = null, unreadable = false;
      text = String(text).replace(/```fox-confirm[ \t]*\n([\s\S]*?)```/g, (m, body) => { ask = proposal(body); if (!ask) unreadable = true; return ''; });
      text = text.replace(/^[ \t]*\[\[confirm (remember|forget):[ \t]*([^\]\n]{1,500})\]\][ \t]*$/gim, (m, kind, what) => { ask = { kind: kind.toLowerCase(), summary: what.trim() }; return ''; }).trim();
      if (ask) unreadable = false;
      if (turns.length) turns[turns.length - 1].fox = text;
      const d = addFox(markdown(text) + '<div class="tools"><button class="link copy">Copy</button></div>');
      d.querySelector('button.copy').onclick = e => { post({ copy: text }); e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy', 1200); };
      d.querySelectorAll('code').forEach(c => {           // a path he found: "Show in Finder" (the app checks it's one he may show)
        const t = c.textContent.trim();
        if (/^(\/|~\/)[^\n]*[^\/\s]\/?$/.test(t) && t.length < 1000 && !c.closest('pre')) {
          const b = document.createElement('button'); b.className = 'reveal'; b.textContent = 'Show in Finder';
          b.onclick = () => post({ reveal: t.replace(/\/$/, '') }); c.after(b);
        }
      });
      if (ask) confirmCard(d, ask);
      else if (unreadable) { settleAll('Not done.'); const n = document.createElement('div'); n.className = 'confirm settled';
        n.innerHTML = '<div class="result">He proposed a change, but not in a form that can be checked, so there\'s nothing to approve. Ask him again.</div>'; d.appendChild(n); }
      scrollDown(); report(); },
    error(text) { dropPending(); setBusy(false); addFox(markdown(text), 'err'); scrollDown(); report(); },
    info(text) { addFox(esc(text), 'err'); scrollDown(); report(); },
    brief(text) { window.bubble.reset(); turns.push({ you: 'Morning check-in, please.', fox: '' }); window.bubble.answer(text); },
    stopped(why) { if (!busy) return; dropPending(); setBusy(false); addFox(esc(why || 'Stopped.'), 'err'); report(); },
    welcome(foxName, brief) {
      clearTimeout(ttlTimer); $('card').className = '';
      W.i = 0; W.a = { name: '', foxName: foxName && foxName !== 'Fox' ? foxName : '', style: 'wit', work: '', brief: brief || 'weekdays' };
      mode('welcome'); wRender();
    },
    reset() { turns.length = 0; $('thread').innerHTML = ''; setBusy(false); $('input').value = ''; setFiles(false); report(); },
  };
  const CALENDAR_TOOLS = ['create_event', 'update_event', 'delete_event', 'respond_to_event'], GMAIL_TOOLS = ['create_draft', 'update_draft'];
  // {tool, summary, input} from a fox-confirm block, or null if it isn't one of the change tools with an arguments object.
  function proposal(body) {
    let p; try { p = JSON.parse(body); } catch (e) { return null; }
    if (!p || typeof p !== 'object' || ![...CALENDAR_TOOLS, ...GMAIL_TOOLS].includes(p.tool)) return null;
    if (!p.input || typeof p.input !== 'object' || Array.isArray(p.input) || typeof p.summary !== 'string' || !p.summary.trim()) return null;
    return { tool: p.tool, summary: p.summary.trim().slice(0, 500), input: p.input };
  }
  const EMAIL = /[A-Za-z0-9._%+'-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
  const shown = v => { const s = typeof v === 'string' ? v : JSON.stringify(v); return s.length > 400 ? s.slice(0, 400) + '…' : s; };
  // A change waiting for your OK: what he says it does, and every argument it would really be made with.
  // Only the newest one can be approved; sending anything else cancels it.
  function confirmCard(d, ask) {
    settleAll('Not done.');
    const local = ask.kind === 'remember' || ask.kind === 'forget';        // his notes: the app does it, no reply needed
    const calendar = CALENDAR_TOOLS.includes(ask.tool);
    const emails = local ? [] : [...new Set(JSON.stringify(ask.input).match(EMAIL) || [])];
    const warn = local ? ''
      : calendar && emails.length && ask.tool !== 'delete_event' ? `<div class="warn">Google Calendar may email: ${esc(emails.join(', '))}</div>`
      : !calendar ? '<div class="note">Saved as a draft in Gmail. Nothing is sent.</div>' : '';
    const rows = Object.entries(ask.input || {}).map(([k, v]) => `<div><span class="k">${esc(k)}</span> ${esc(shown(v))}</div>`).join('');
    const card = document.createElement('div'); card.className = 'confirm live';
    const label = local ? (ask.kind === 'remember' ? 'Remember' : 'Forget') : calendar ? 'Calendar' : 'Gmail draft';
    card.innerHTML = `<div class="what">${label}: ${esc(ask.summary)}</div>` + warn +
      (local ? '' : `<details class="args" open><summary>Exactly what he'll do (${esc(ask.tool)})</summary>${rows || '<div>(no arguments)</div>'}</details>`) +
      `<div class="actions"><button class="act primary yes">${local ? (ask.kind === 'remember' ? 'Save it' : 'Forget it') : 'Yes, do it'}</button><button class="act no">No</button></div><div class="result" hidden></div>`;
    card.querySelector('.yes').onclick = () => {
      if (busy) return;
      if (local) { settle(card, 'Approved.'); post({ confirm: ask }); return; }
      settle(card, 'Approved.');
      turns.push({ you: 'Yes, do it: ' + ask.summary, fox: '' }); addYou('Yes, do it'); pending(); setBusy(true); scrollDown();
      post({ confirm: ask });
    };
    card.querySelector('.no').onclick = () => settle(card, 'Not done.');
    d.appendChild(card);
  }
  function settle(card, why) { card.classList.remove('live'); card.classList.add('settled'); const r = card.querySelector('.result'); r.textContent = why; r.hidden = false; report(); }
  function settleAll(why) { document.querySelectorAll('.confirm.live').forEach(c => settle(c, why)); }
  // ---------- the welcome: a few quick questions the first time (answers go to the app in one message) ----------
  const W = { i: 0, a: {} };
  const STEPS = [
    { html: () => '<h3>Hi there!</h3><p>I\'m the fox in your corner. I keep an eye on Claude for you, and I can help with your files, email and calendar.</p><p>A few quick questions so I can be <em>your</em> fox?</p>',
      next: "Let's go", skip: 'Maybe later', first: true },
    { q: () => 'First things first: what should I call you?', input: 'name', placeholder: 'Your first name' },
    { q: a => `Nice to meet you${a.name ? ', ' + a.name : ''}! And what would you like to call me?`, input: 'foxName', placeholder: 'Fox',
      chips: ['Fox', 'Rusty', 'Ember', 'Biscuit', 'Scout'] },
    { q: () => 'How chatty should I be?', key: 'style', choices: [
      ['facts', 'Just the facts', 'Short and to the point.'],
      ['wit', 'A little wit', 'Helpful, with the odd dry one-liner.'],
      ['comedian', 'Full comedian', 'The answer first, then the jokes come out.']] },
    { q: () => 'Anything I should know about what you do? (Optional: it helps me help.)', input: 'work', multiline: true,
      placeholder: 'e.g. I manage marketing analytics, and I live in spreadsheets' },
    { q: () => 'Want a morning check-in? Today\'s meetings and email that needs you, the first time you sit down at your Mac.', key: 'brief', choices: [
      ['weekdays', 'Weekdays'], ['daily', 'Every day'], ['off', 'No thanks']] },
    { html: a => `<h3>All set${a.name ? ', ' + esc(a.name) : ''}!</h3><p>Double-click me any time to chat. Right-click me for everything else, including <strong>What He Knows About You…</strong> if you want to tell me more.</p>`,
      next: 'Start chatting', last: true },
  ];
  function wRender() {
    const st = STEPS[W.i], a = W.a, box = $('wStep');
    let h = st.html ? st.html(a) : `<div class="q">${esc(st.q(a))}</div>`;
    if (st.input) h += st.multiline ? `<textarea id="wIn" rows="3" placeholder="${esc(st.placeholder)}"></textarea>` : `<input id="wIn" placeholder="${esc(st.placeholder)}" maxlength="60">`;
    if (st.chips) h += '<div class="chips">' + st.chips.map(c => `<button class="chip" data-v="${esc(c)}">${esc(c)}</button>`).join('') + '</div>';
    if (st.choices) h += '<div class="choices">' + st.choices.map(([v, t, d]) => `<button class="choice${a[st.key] === v ? ' on' : ''}" data-v="${esc(v)}">${esc(t)}${d ? `<small>${esc(d)}</small>` : ''}</button>`).join('') + '</div>';
    box.innerHTML = h;
    const inp = $('wIn');
    if (inp) { inp.value = a[st.input] || ''; setTimeout(() => inp.focus(), 30);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); wGo(1); } }); }
    box.querySelectorAll('.chip').forEach(c => c.onclick = () => { inp.value = c.dataset.v; inp.focus(); });
    box.querySelectorAll('.choice').forEach(c => c.onclick = () => { a[st.key] = c.dataset.v; wGo(1); });
    $('wNext').textContent = st.next || 'Next';
    $('wNext').hidden = !!st.choices;                       // a choice moves on by itself
    $('wSkip').textContent = st.skip || 'Skip';
    $('wSkip').hidden = !!(st.last || (st.choices && !st.first));
    $('wBack').hidden = !!(st.first || st.last);
    $('wDots').innerHTML = STEPS.map((_, i) => `<span class="${i === W.i ? 'on' : ''}"></span>`).join('');
    report();
  }
  function wKeep() { const st = STEPS[W.i], inp = $('wIn'); if (st.input && inp) W.a[st.input] = inp.value.trim().slice(0, st.multiline ? 300 : 60); }
  function wGo(d) {
    const st = STEPS[W.i];
    if (d > 0 && st.last) { post({ welcome: W.a }); return; }
    if (d > 0) wKeep();
    W.i = Math.max(0, Math.min(STEPS.length - 1, W.i + d)); wRender();
  }
  $('wNext').onclick = () => wGo(1);
  $('wBack').onclick = () => { wKeep(); wGo(-1); };
  $('wSkip').onclick = () => {
    const st = STEPS[W.i];
    if (st.first) { post({ welcome: null }); return; }    // "Maybe later"
    if (st.input) W.a[st.input] = '';
    W.i = Math.min(STEPS.length - 1, W.i + 1); wRender();
  };

  function setFiles(on) { readFiles = on; $('files').classList.toggle('on', on); $('files').textContent = on ? 'Files: can open' : 'Files: names only'; }
  $('files').onclick = () => { setFiles(!readFiles); post({ readFiles }); };
  $('close').onclick = () => post({ action: 'dismiss' });
  $('jump').onclick = () => post({ action: 'jump' });
  const send = () => { const q = $('input').value.trim(); if (!q || busy) return; $('input').value = ''; settleAll('Not done.'); post({ ask: q.slice(0, 4000) }); };
  $('send').onclick = send;
  $('newChat').onclick = () => { window.bubble.reset(); post({ newChat: true }); $('input').focus(); };
  $('openClaude').onclick = () => { openInClaude($('input').value); };
  $('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); openInClaude($('input').value); return; }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    if (e.key === 'Escape') { e.stopPropagation(); post({ action: 'dismiss' }); }
  });
  $('input').addEventListener('input', () => { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight + 2) + 'px'; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') post({ action: 'dismiss' }); });
  mode('say');
})();
</script>
</body></html>
