# Builds the ready-to-run download: Fox Buddy.app for Apple silicon and Intel, signed with your Developer ID and
# notarized by Apple (so it opens with a double-click), as a .dmg and a .zip.
#
#   Push a tag like v1.2.0  ->  a GitHub Release with both files attached.
#   Actions > Release > Run workflow, or a push to a ci/... branch  ->  a test build, kept as the run's artifact.
#
# Signing and notarizing need five repository secrets (see RELEASING.md). Without them the build still runs,
# signed ad hoc: fine for checking it compiles, but macOS won't open that download with a double-click.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]          # a test build from a branch: git push origin HEAD:ci/try
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Bridge and tool tests
        run: python3 -m unittest discover -s tests

      - name: Signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$ID" ] || { echo "No Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build
        run: UNIVERSAL=1 zsh tools/foxbuddy/package.sh dist

      - name: Notarize the app
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_ARGS=--key $RUNNER_TEMP/notary.p8 --key-id $NOTARY_KEY_ID --issuer $NOTARY_ISSUER_ID" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "dist/Fox Buddy.app" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m
          xcrun stapler staple "dist/Fox Buddy.app"
          spctl --assess --type execute --verbose=2 "dist/Fox Buddy.app"

      - name: Disk image and zip
        run: |
          NAME="Fox-Buddy-$VERSION"
          mkdir -p "$RUNNER_TEMP/dmg" out
          cp -R "dist/Fox Buddy.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Fox Buddy" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "out/$NAME.dmg"
          ditto -c -k --keepParent "dist/Fox Buddy.app" "out/$NAME.zip"
          if [ "$HAS_SIGNING" = true ]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "out/$NAME.dmg"
            xcrun notarytool submit "out/$NAME.dmg" $NOTARY_ARGS --wait --timeout 30m
            xcrun stapler staple "out/$NAME.dmg"
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: Fox-Buddy-${{ env.VERSION }}
          path: out/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Download the .dmg, open it, and drag Fox Buddy to Applications. See the README for what he needs (Claude Code, signed in)."
          [ "$HAS_SIGNING" = true ] || NOTE="$NOTE Unsigned test build: right-click the app and choose Open the first time."
          gh release create "$GITHUB_REF_NAME" out/* --title "Fox Buddy $VERSION" --notes "$NOTE" --generate-notes

      - name: Clean up the keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
