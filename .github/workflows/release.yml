# Builds the ready-to-run download: Fox Buddy.app for Apple silicon and Intel, signed with your Developer ID and
# notarized by Apple (so it opens with a double-click), as a .dmg and a .zip.
#
#   Push a tag like v1.2.0 (zsh ship.sh)  ->  a GitHub Release with both files attached.
#   Actions > Release > Run workflow on main, with "ship" typed in the confirm box  ->  the same, from any
#     browser: it works out the next version, builds, and only then makes the tag and the release.
#   Actions > Release > Run workflow with the confirm box empty, or a push to a ci/... branch  ->  a test
#     build, kept as the run's artifact.
#
# Signing and notarizing need repository secrets (see RELEASING.md). Without them the build still runs,
# signed ad hoc: fine for checking it compiles, but macOS won't open that download with a double-click.
# One-click updates (Sparkle) need one more secret, SPARKLE_PRIVATE_KEY. Without it the app is built without
# Sparkle and his update notice offers the DMG instead. With it, each release also gets an appcast.xml (the
# update feed, signed with that key), and Homebrew's cask is pointed at the new version.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]          # a test build from a branch: git push origin HEAD:ci/try
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ship to publish a new version to everyone. Leave it empty for a test build.'
        required: false
        default: ''
      version:
        description: 'Which version: empty for the next small one (1.0.9 -> 1.0.10), or minor, major, or exactly 1.2.3'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && (secrets.NOTARY_KEY_P8 != '' || secrets.NOTARY_APPLE_ID != '') }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      SPARKLE_VERSION: "2.9.4"
    steps:
      - uses: actions/checkout@v4

      - name: Version
        env:
          IN_CONFIRM: ${{ inputs.confirm }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          IN_CONFIRM="$(printf '%s' "$IN_CONFIRM" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          IN_VERSION="$(printf '%s' "$IN_VERSION" | tr -d '[:space:]')"; IN_VERSION="${IN_VERSION#v}"
          SHIP=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"; SHIP=true
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$IN_CONFIRM" ]; then
            [ "$IN_CONFIRM" = ship ] || { echo "::error::To publish, type exactly: ship (you typed \"$IN_CONFIRM\"). Leave it empty for a test build."; exit 1; }
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Ship from main: choose main in the \"Use workflow from\" box."; exit 1; }
            git fetch -q --tags origin
            LAST="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)"; LAST="${LAST#v}"; LAST="${LAST%%-*}"
            IFS=. read -r MAJ MIN PAT <<< "${LAST:-0.0.0}"
            case "${IN_VERSION:-patch}" in
              patch) V="$MAJ.$MIN.$((PAT + 1))" ;;
              minor) V="$MAJ.$((MIN + 1)).0" ;;
              major) V="$((MAJ + 1)).0.0" ;;
              *) V="$IN_VERSION" ;;
            esac
            [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::\"$IN_VERSION\" isn't a version. Leave it empty, or use minor, major, or a version like 1.2.3."; exit 1; }
            if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "::error::v$V already exists."; exit 1; fi
            SHIP=true
            echo "Shipping v$V (the last version was v${LAST:-none})"
          else
            V="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"
          echo "SHIP=$SHIP" >> "$GITHUB_ENV"

      - name: Bridge and tool tests
        run: python3 -m unittest discover -s tests

      - name: Homebrew cask check
        continue-on-error: true
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew tap justinfuchs85/fox-buddy "$GITHUB_WORKSPACE"
          brew trust --cask justinfuchs85/fox-buddy/fox-buddy      # Homebrew 6 only loads third-party casks you trust
          brew style justinfuchs85/fox-buddy/fox-buddy
          brew audit --cask --online justinfuchs85/fox-buddy/fox-buddy
          brew install --cask justinfuchs85/fox-buddy/fox-buddy && ls -d "/Applications/Fox Buddy.app"
          brew uninstall --cask justinfuchs85/fox-buddy/fox-buddy

      - name: Signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # Apple's Developer ID intermediate certificates, so the identity's chain checks out on this runner
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" \
              && security import "$RUNNER_TEMP/$ca.cer" -k "$KC" >/dev/null 2>&1 || true
          done
          echo "Signing identities in the certificate file (names only):"
          security find-identity -p codesigning "$KC" | sed -E 's/^ *[0-9]+\) [0-9A-F]+ /  /'
          ID="$(security find-identity -v -p codesigning "$KC" | awk '/Developer ID Application/ {print $2; exit}')"   # its SHA-1: never ambiguous
          if [ -z "$ID" ]; then
            echo "::error::MACOS_CERT_P12 has no valid 'Developer ID Application' identity (see the list above). Export that certificate, with its private key, from Keychain Access › login › My Certificates."
            exit 1
          fi
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Sparkle, for one-click updates
        if: env.HAS_SPARKLE == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" | tar -xJ -C "$RUNNER_TEMP/sparkle"
          ( umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key" )
          PUB="$(python3 tools/sparkle_key.py public "$RUNNER_TEMP/sparkle.key")"
          echo "Update-signing public key: $PUB"
          echo "SPARKLE_DIR=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
          echo "SPARKLE_PUBLIC_KEY=$PUB" >> "$GITHUB_ENV"
          echo "SUFEED_URL=https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" >> "$GITHUB_ENV"

      - name: Build
        run: UNIVERSAL=1 zsh tools/foxbuddy/package.sh dist

      - name: Self-test (Command Bar sums and conversions)
        run: '"dist/Fox Buddy.app/Contents/MacOS/FoxBuddy" --self-test'

      - name: Check a build with Sparkle (test builds, before the update key is set up)
        if: env.HAS_SPARKLE != 'true' && startsWith(github.ref, 'refs/heads/ci/')
        run: |
          # compiles, embeds and signs Sparkle with a throwaway key; this copy isn't kept
          mkdir -p "$RUNNER_TEMP/sparkle-check"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" | tar -xJ -C "$RUNNER_TEMP/sparkle-check"
          SPARKLE_DIR="$RUNNER_TEMP/sparkle-check" SPARKLE_PUBLIC_KEY="$(head -c 32 /dev/urandom | base64)" SUFEED_URL="https://example.invalid/appcast.xml" \
            UNIVERSAL=1 zsh tools/foxbuddy/package.sh "$RUNNER_TEMP/sparkle-build"
          ls "$RUNNER_TEMP/sparkle-build/Fox Buddy.app/Contents/Frameworks"
          /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$RUNNER_TEMP/sparkle-build/Fox Buddy.app/Contents/Info.plist"
          otool -L "$RUNNER_TEMP/sparkle-build/Fox Buddy.app/Contents/MacOS/FoxBuddy" | grep Sparkle

      - name: Notarize the app
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          # Either an App Store Connect API key, or your Apple ID with an app-specific password: kept in a
          # notarytool profile in the build keychain, so no credential appears on a command line.
          KC="$RUNNER_TEMP/signing.keychain-db"
          if [ -n "$NOTARY_KEY_P8" ]; then
            printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials fox --keychain "$KC" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          else
            xcrun notarytool store-credentials fox --keychain "$KC" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          fi
          echo "NOTARY_ARGS=--keychain-profile fox --keychain $KC" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "dist/Fox Buddy.app" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" --keychain-profile fox --keychain "$KC" --wait --timeout 30m
          xcrun stapler staple "dist/Fox Buddy.app"
          spctl --assess --type execute --verbose=2 "dist/Fox Buddy.app"

      - name: Disk image and zip
        run: |
          NAME="Fox-Buddy-$VERSION"
          mkdir -p "$RUNNER_TEMP/dmg" out
          cp -R "dist/Fox Buddy.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Fox Buddy" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "out/$NAME.dmg"
          ditto -c -k --keepParent "dist/Fox Buddy.app" "out/$NAME.zip"
          if [ "$HAS_SIGNING" = true ]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "out/$NAME.dmg"
            xcrun notarytool submit "out/$NAME.dmg" $NOTARY_ARGS --wait --timeout 30m
            xcrun stapler staple "out/$NAME.dmg"
          fi
          cp "out/$NAME.dmg" out/Fox-Buddy.dmg      # a name that never changes: .../releases/latest/download/Fox-Buddy.dmg
          ls -l out

      - name: Update feed
        if: env.HAS_SPARKLE == 'true'
        run: |
          # Sparkle installs the zip. Sign it, check the signature against the key in the app, then write the feed.
          NAME="Fox-Buddy-$VERSION"
          OUT="$("$SPARKLE_DIR/bin/sign_update" --ed-key-file "$RUNNER_TEMP/sparkle.key" "out/$NAME.zip")"
          SIG="$(printf '%s' "$OUT" | sed -nE 's/.*sparkle:edSignature="([^"]+)".*/\1/p')"
          LEN="$(stat -f %z "out/$NAME.zip")"
          python3 tools/sparkle_key.py verify "$SPARKLE_PUBLIC_KEY" "out/$NAME.zip" "$SIG"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases"
          cat > out/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Fox Buddy</title>
              <item>
                <title>Fox Buddy $VERSION</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>$VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>12.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>$BASE/tag/v$VERSION</sparkle:fullReleaseNotesLink>
                <description><![CDATA[<p>What's new in Fox Buddy $VERSION is on <a href="$BASE/tag/v$VERSION">GitHub</a>.</p>]]></description>
                <enclosure url="$BASE/download/v$VERSION/$NAME.zip" length="$LEN" type="application/octet-stream" sparkle:edSignature="$SIG"/>
              </item>
            </channel>
          </rss>
          XML
          cat out/appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: Fox-Buddy-${{ env.VERSION }}
          path: out/*

      - name: Release
        if: env.SHIP == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Download the .dmg, open it, and drag Fox Buddy to Applications. See the README for what he needs (Claude Code, signed in)."
          [ "$HAS_SIGNING" = true ] || NOTE="$NOTE Unsigned test build: right-click the app and choose Open the first time."
          # From the Run workflow button there's no tag yet: the release makes it, on the commit that was built.
          TARGET=(); [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && TARGET=(--target "$GITHUB_SHA")
          gh release create "$TAG" out/* "${TARGET[@]}" --title "Fox Buddy $VERSION" --notes "$NOTE" --generate-notes

      - name: Homebrew cask
        if: env.SHIP == 'true'
        run: |
          # Point Casks/fox-buddy.rb at this release, so  brew install --cask justinfuchs85/fox-buddy/fox-buddy  gets it.
          SHA="$(shasum -a 256 "out/Fox-Buddy-$VERSION.dmg" | cut -d' ' -f1)"
          git fetch -q origin main && git checkout -q -B main origin/main
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/fox-buddy.rb
          if git diff --quiet; then echo "cask already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "Homebrew: Fox Buddy $VERSION" && git push -q origin main

      - name: Clean up the keychain and keys
        if: always() && (env.HAS_SIGNING == 'true' || env.HAS_SPARKLE == 'true')
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
