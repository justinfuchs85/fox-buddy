# The Fox Buddy iPhone app. Make the Xcode project from this with XcodeGen:
#   brew install xcodegen
#   cd ios && xcodegen && open FoxBuddyPhone.xcodeproj
# Your team and bundle id prefix go in Signing.xcconfig (once). See ios/README.md.
name: FoxBuddyPhone
options:
  deploymentTarget:
    iOS: "17.2"            # starting a Live Activity by push needs 17.2
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  FoxBuddy:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # his drawing code, shared with the Mac app: the app plays him with fox.html
      - path: ../characters/fox/fox.js
        buildPhase: resources
      - path: ../characters/fox/rig.js
        buildPhase: resources
      - path: ../characters/fox/character.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).phone
        PRODUCT_NAME: FoxBuddy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fox Buddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        FoxBuddyAppGroup: group.$(BUNDLE_PREFIX).phone
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [foxbuddy]
    entitlements:
      path: App/FoxBuddy.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).phone]
    dependencies:
      - target: FoxBuddyWidgets
      - target: FoxBuddyNotify

  FoxBuddyWidgets:          # the Live Activity (Lock Screen and Dynamic Island)
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).phone.widgets
        PRODUCT_NAME: FoxBuddyWidgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Fox Buddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FoxBuddyAppGroup: group.$(BUNDLE_PREFIX).phone
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/FoxBuddyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).phone]

  FoxBuddyNotify:           # decrypts each alert before it shows
    type: app-extension
    platform: iOS
    sources:
      - path: Notify
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).phone.notify
        PRODUCT_NAME: FoxBuddyNotify
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: Fox Buddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FoxBuddyAppGroup: group.$(BUNDLE_PREFIX).phone
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notify/FoxBuddyNotify.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).phone]
